name: Release

# Build the Windows installer and publish a GitHub Release when a version tag is
# pushed (for example `v0.0.1`). The tag drives the version stamped into the app.
#
# Code signing uses DigiCert KeyLocker. The inner engine exe, the app exe, and the
# installer are signed. Releases from sol1/pbsgui must be signed, so a missing
# secret fails the build instead of publishing unsigned installers. Forks without
# the secrets still build, unsigned. Signing needs:
#   secrets: SM_API_KEY, SM_CLIENT_CERT_FILE_B64, SM_CLIENT_CERT_PASSWORD
#   vars:    SM_HOST, SM_CODE_SIGNING_CERT_SHA1_HASH
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload the installer

env:
  CARGO_TERM_COLOR: always

jobs:
  release-windows:
    name: Build and publish installer (Windows)
    runs-on: windows-latest
    env:
      # DigiCert KeyLocker (empty until the secrets/vars are set -> unsigned build).
      SM_HOST: ${{ vars.SM_HOST }}
      SM_API_KEY: ${{ secrets.SM_API_KEY }}
      SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
      SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ vars.SM_CODE_SIGNING_CERT_SHA1_HASH }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (needed to build ring)
        uses: ilammy/setup-nasm@v1
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Detect code-signing availability
        id: signing
        shell: bash
        run: |
          if [ -n "$SM_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Code signing: ENABLED (DigiCert secrets present)."
          elif [ "$GITHUB_REPOSITORY" = "sol1/pbsgui" ]; then
            echo "::error::DigiCert secrets are not set; refusing to publish an unsigned release."
            exit 1
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Code signing: disabled (DigiCert secrets not set); building unsigned."
          fi

      - name: Set up DigiCert KeyLocker
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Decode the client-auth cert (mTLS to Software Trust Manager). Make it
          # available to smctl in THIS step (process env) AND to the later signing
          # steps (GITHUB_ENV reaches subsequent steps only, not this one) - without
          # the process env var, certsync below has no client cert and cannot auth.
          $certPath = "$env:RUNNER_TEMP\cert.p12"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String("${{ secrets.SM_CLIENT_CERT_FILE_B64 }}"))
          $env:SM_CLIENT_CERT_FILE = $certPath
          "SM_CLIENT_CERT_FILE=$certPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          # Install the KeyLocker client tools (smctl + the signing KSP).
          curl.exe -fSL -X GET "https://one.digicert.com/signingmanager/api-ui/v1/releases/Keylockertools-windows-x64.msi/download" -H "x-api-key:$env:SM_API_KEY" -o "$env:RUNNER_TEMP\keylockertools.msi"
          $msi = Start-Process msiexec.exe -ArgumentList "/i `"$env:RUNNER_TEMP\keylockertools.msi`" /quiet /qn" -Wait -PassThru
          if ($msi.ExitCode -ne 0) { throw "KeyLocker tools install failed (msiexec exit $($msi.ExitCode))." }
          $ssm = "C:\Program Files\DigiCert\DigiCert KeyLocker Tools"
          "$ssm" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          # Validate the credentials up front: a clear failure here beats a cryptic
          # signtool error later. Diagnostic only, so a healthcheck quirk cannot
          # block an otherwise-good key. smctl prints part of the API key and the
          # client cert password, which GitHub does not mask, so drop those lines.
          & "$ssm\smctl.exe" healthcheck 2>&1 | Where-Object { $_ -notmatch 'API key:|password' } | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { Write-Warning "smctl healthcheck reported a problem ($LASTEXITCODE); continuing to certsync." }
          # Sync the signing cert into the Windows store and register the KSP, so
          # signtool /sha1 <thumbprint> can sign through the cloud-held key.
          & "$ssm\smctl.exe" windows certsync
          if ($LASTEXITCODE -ne 0) { throw "smctl windows certsync failed ($LASTEXITCODE): check SM_HOST / SM_API_KEY / SM_CLIENT_CERT_FILE_B64 / SM_CLIENT_CERT_PASSWORD." }
          # Guard: confirm certsync installed a code-signing certificate matching
          # SM_CODE_SIGNING_CERT_SHA1_HASH before the build spends time signing. A
          # mismatch here (renewed cert, wrong thumbprint) fails with a clear
          # message instead of a late signtool "No certificates were found".
          # Thumbprints and subjects are not secrets.
          $want = "${{ vars.SM_CODE_SIGNING_CERT_SHA1_HASH }}"
          $signing = Get-ChildItem Cert:\CurrentUser\My, Cert:\LocalMachine\My |
            Where-Object { $_.EnhancedKeyUsageList.FriendlyName -contains 'Code Signing' }
          $signing | ForEach-Object {
            Write-Host ("code-signing cert: Thumbprint={0}  Subject={1}" -f $_.Thumbprint, $_.Subject)
          }
          if (-not ($signing.Thumbprint -contains $want)) {
            throw "SM_CODE_SIGNING_CERT_SHA1_HASH ($want) matches no code-signing certificate that certsync installed. Update the variable to a thumbprint listed above."
          }
          Write-Host "code-signing thumbprint $want is present."

      - name: Compute version from the tag
        id: version
        shell: pwsh
        run: |
          $fullver = "${{ github.ref_name }}".TrimStart('v')
          # The installer/product version must be a plain numeric semver, so drop
          # any prerelease suffix (0.3.0-rc.1 -> 0.3.0) for what Tauri/NSIS stamp.
          # The full tag still names the GitHub Release and the in-app build string.
          $numver = ($fullver -split '-')[0]
          $short = "${{ github.sha }}".Substring(0, 7)
          "PBSGUI_VERSION=$numver"          | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PBSGUI_BUILD=$fullver ($short)"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          '{"version":"' + $numver + '"}'   | Out-File -FilePath build-version.json -Encoding ascii
          # A semver prerelease tag (containing a hyphen, e.g. v0.3.0-rc.1) is
          # published as a GitHub pre-release: it does not become "Latest", so the
          # last stable tag stays the default download.
          $pre = if ($fullver -match '-') { 'true' } else { 'false' }
          "prerelease=$pre" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version $fullver (numeric $numver, prerelease=$pre)"

      - name: Build engine
        run: cargo build -p pbsgui-engine --release

      - name: Sign engine
        # Tauri signs the app exe and installer via signCommand, but the sidecar
        # engine exe is signed explicitly here before it is staged.
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        working-directory: src-tauri
        run: ./sign-windows.ps1 ../target/release/pbsgui-engine.exe

      - name: Stage engine as a Tauri sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item target/release/pbsgui-engine.exe `
            src-tauri/binaries/pbsgui-engine-x86_64-pc-windows-msvc.exe

      - name: Build app and NSIS installers (offline + online)
        # engine-sidecar.conf.json bundles the engine sidecar; build-version.json
        # stamps the version; a generated signing config (signCommand) is appended
        # only when signing is enabled. We build twice: the default bundles WebView2 (offline,
        # air-gapped), then webview-online.conf.json makes a smaller installer that
        # downloads WebView2 at install. The second build only re-bundles (the Rust
        # binaries are unchanged), so it is quick.
        shell: pwsh
        run: |
          $configs = @('--config', 'src-tauri/engine-sidecar.conf.json', '--config', 'build-version.json')
          if ('${{ steps.signing.outputs.enabled }}' -eq 'true') {
            # Tauri runs bundle.windows.signCommand from the build cwd (the repo
            # root), not from src-tauri, so a relative script path is not found
            # ("failed to run powershell"). Generate the config with an ABSOLUTE
            # path to sign-windows.ps1, using the object form so the argument
            # parsing is unambiguous. %1 is the artifact Tauri wants signed (the
            # app exe and each installer; the engine sidecar is already signed).
            $signScript = (Resolve-Path 'src-tauri/sign-windows.ps1').Path
            $signConf = [ordered]@{ bundle = [ordered]@{ windows = [ordered]@{
              signCommand = [ordered]@{
                cmd  = 'powershell'
                args = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $signScript, '%1')
              }
            } } }
            ($signConf | ConvertTo-Json -Depth 8) |
              Set-Content -Path 'src-tauri/signing.gen.conf.json' -Encoding ascii
            $configs += @('--config', 'src-tauri/signing.gen.conf.json')
          }
          $nsis = 'target/release/bundle/nsis'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # 1) Full offline installer (bundles WebView2).
          tauri build @configs
          $full = Get-ChildItem "$nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $full.FullName "dist/$($full.Name)"
          # 2) Small online installer (downloads WebView2 at install); same name in
          #    the bundle dir, so copy it out with an -online suffix.
          tauri build @configs --config src-tauri/webview-online.conf.json
          $small = Get-ChildItem "$nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $small.FullName ("dist/{0}-online{1}" -f $small.BaseName, $small.Extension)
          Get-ChildItem dist | Select-Object Name, Length

      - name: Verify the installers are signed
        # Confirm the published artifacts actually carry a valid Authenticode
        # signature (chaining to a trusted root), so a silent signing no-op can
        # never ship as a "signed" release.
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
              Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found for verification." }
          foreach ($f in Get-ChildItem dist\*.exe) {
              & $signtool.FullName verify /pa /v $f.FullName
              if ($LASTEXITCODE -ne 0) { throw "signature verification failed for $($f.Name)" }
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: pbsgui ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          # Append the auto-generated commit/PR list since the previous tag.
          generate_release_notes: true
          # Mark a semver prerelease tag as a pre-release, so it is not flagged
          # "Latest" and the last stable release stays the default download.
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: dist/*.exe
          fail_on_unmatched_files: true
