[package]
name = "pbsgui-vss"
description = "pbsgui Volume Shadow Copy requester: hand-declared vsbackup.h bindings and a volume snapshot for consistent file reads"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true

[target.'cfg(windows)'.dependencies]
# COM bindings for the VSS requester. The vsbackup.h interfaces themselves are
# hand-declared in src/bindings.rs (they are absent from the crate's metadata);
# these features supply IVssAsync, the VSS enums/structs, COM init, and volume
# lookup.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Storage_Vss",
    "Win32_Storage_FileSystem",
] }
# Required directly: the #[interface] macro expands to `windows_core::` paths.
windows-core = "0.58"
